name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release & Debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from the KEYSTORE_BASE64 secret"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Generating a temporary key; APKs from this run cannot update APKs from other runs."
            keytool -genkeypair -keystore "$KS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=TexForge, OU=Android, O=TexForge, L=City, ST=State, C=US"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Ensure debug.keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            else
              keytool -genkeypair -keystore debug.keystore \
                -alias androiddebugkey -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug, O=Android, C=US"
            fi
          fi

      - name: Download depth model (Depth Anything V2 Small, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 -o app/src/main/assets/models/depth_model.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/depth_model.onnx)
          echo "Model size: $SIZE bytes"
          [ "$SIZE" -gt 90000000 ] || { echo "::error::Model download looks wrong"; exit 1; }

      - name: Unit tests and build APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease \
            --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload diagnostics (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            app/build/reports/**
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: texforge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: texforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
