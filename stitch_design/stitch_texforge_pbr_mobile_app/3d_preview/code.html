</div>

<!-- Environment Lighting Presets Section -->

<button class="env-chip h-9 px-4 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 whitespace-nowrap active:bg-surface-container-high transition-colors" data-env="Outdoor">
<span class="material-symbols-outlined text-[16px]">wb_sunny</span>
        Outdoor
      </button>
<button class="env-chip h-9 px-4 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 whitespace-nowrap active:bg-surface-container-high transition-colors" data-env="Sunset">
<span class="material-symbols-outlined text-[16px]">flare</span>

      </button>
<button class="env-chip h-9 px-4 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md flex items-center gap-1.5 whitespace-nowrap active:bg-surface-container-high transition-colors" data-env="Dark">
<span class="material-symbols-outlined text-[16px]">bedtime</span>
        Dark
      </button>
</div>
</div>
<!-- Primary Bottom Action Dock -->
<div class="w-full pt-space-xs pb-space-sm">
<button class="w-full h-[52px] rounded-xl bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center gap-2 active:opacity-90 shadow-md transition-opacity">
<span class="material-symbols-outlined text-[20px]">ios_share</span>
      Export Material Maps (.zip)
    </button>
</div>
<!-- Bottom Sheet: Material Parameters Adjustment -->
<div class="w-full bg-surface-container-low rounded-t-xl px-space-md pt-2 pb-space-lg mt-space-sm transition-all duration-300" id="adjust-sheet">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-2">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between mb-space-md mt-1">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-[20px]">sliders</span>
<h2 class="font-title-md text-title-md text-on-surface">Adjust Material</h2>
</div>

        Reset
      </button>
</div>
<!-- Sliders List -->
<div class="flex flex-col gap-space-md">
<!-- Light Angle Slider -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="slider-angle">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">lightbulb</span>
            Light Angle
          </label>
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono" id="val-angle">135°</span>
</div>
<div class="relative w-full flex items-center h-5">
<input class="w-full h-1 bg-outline rounded-lg appearance-none cursor-pointer accent-primary-container" id="slider-angle" max="360" min="0" type="range" value="135"/>
</div>
</div>
<!-- Displacement Height Slider -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="slider-displacement">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">layers</span>
            Displacement
          </label>
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono" id="val-displacement">0.45</span>
</div>
<div class="relative w-full flex items-center h-5">
<input class="w-full h-1 bg-outline rounded-lg appearance-none cursor-pointer accent-primary-container" id="slider-displacement" max="1" min="0" step="0.01" type="range" value="0.45"/>
</div>
</div>
<!-- Repeat / Tiling Frequency Slider -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="slider-tiling">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">grid_4x4</span>
            Repeat / Tiling
          </label>
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono" id="val-tiling">2.0x</span>
</div>
<div class="relative w-full flex items-center h-5">
<input class="w-full h-1 bg-outline rounded-lg appearance-none cursor-pointer accent-primary-container" id="slider-tiling" max="8" min="1" step="0.5" type="range" value="2"/>
</div>
</div>
</div>
</div>
</div>
<script>
  // Micro-interactions for PBR Previewer
  const sliderAngle = document.getElementById('slider-angle');
  const valAngle = document.getElementById('val-angle');
  const sliderDisp = document.getElementById('slider-displacement');
  const valDisp = document.getElementById('val-displacement');
  const sliderTiling = document.getElementById('slider-tiling');
  const valTiling = document.getElementById('val-tiling');
  const viewportRender = document.getElementById('viewport-render');
  const envChips = document.querySelectorAll('.env-chip');
  const activeEnvLabel = document.getElementById('active-env-label');
  const adjustSheet = document.getElementById('adjust-sheet');
  const adjustToggleBtn = document.getElementById('adjust-toggle-btn');
  const resetBtn = document.getElementById('reset-params-btn');

  // Slider Readouts and subtle visual simulated feedback
  sliderAngle?.addEventListener('input', (e) => {
    valAngle.textContent = `${e.target.value}°`;
    const rot = (e.target.value - 135) * 0.08;
    viewportRender.style.transform = `rotate(${rot}deg)`;
  });

  sliderDisp?.addEventListener('input', (e) => {
    valDisp.textContent = parseFloat(e.target.value).toFixed(2);
    const scale = 1 + (e.target.value - 0.45) * 0.05;
    viewportRender.style.transform = `scale(${scale})`;
  });

  sliderTiling?.addEventListener('input', (e) => {
    valTiling.textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
  });

  // Lighting Preset selection toggle
  envChips.forEach(chip => {
    chip.addEventListener('click', () => {
      envChips.forEach(c => {
        c.classList.remove('bg-primary-container', 'text-on-primary');
        c.classList.add('bg-surface-container', 'text-on-surface-variant');
      });
      chip.classList.add('bg-primary-container', 'text-on-primary');
      chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
      
      const envName = chip.getAttribute('data-env');
      if (activeEnvLabel) {
        activeEnvLabel.textContent = `${envName} Environment`;
      }
    });
  });

  // Segmented control toggle
  const tabSphere = document.getElementById('tab-sphere');
  const tabTiling = document.getElementById('tab-tiling');

  tabSphere?.addEventListener('click', () => {
    tabSphere.classList.add('bg-surface-variant', 'text-on-surface');
    tabSphere.classList.remove('text-on-surface-variant');
    tabTiling.classList.remove('bg-surface-variant', 'text-on-surface');
    tabTiling.classList.add('text-on-surface-variant');
  });

  tabTiling?.addEventListener('click', () => {
    tabTiling.classList.add('bg-surface-variant', 'text-on-surface');
    tabTiling.classList.remove('text-on-surface-variant');
    tabSphere.classList.remove('bg-surface-variant', 'text-on-surface');
    tabSphere.classList.add('text-on-surface-variant');
  });

  // Toggle sheet focus scroll
  adjustToggleBtn?.addEventListener('click', () => {
    adjustSheet?.scrollIntoView({ behavior: 'smooth' });
  });

  // Reset defaults
  resetBtn?.addEventListener('click', () => {
    if (sliderAngle) {
      sliderAngle.value = 135;
      valAngle.textContent = '135°';
    }
    if (sliderDisp) {
      sliderDisp.value = 0.45;
      valDisp.textContent = '0.45';
    }
    if (sliderTiling) {
      sliderTiling.value = 2;
      valTiling.textContent = '2.0x';
    }
    if (viewportRender) {
      viewportRender.style.transform = 'none';
    }
  });
</script></main></body></html>
