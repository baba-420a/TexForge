<!-- Rule of Thirds 3x3 Overlay -->
<div class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3 z-10 p-3">
<!-- Row 1 -->
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative">
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<!-- Row 2 -->
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative">
<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-inverse-surface/25"></div>
</div>
<!-- Row 3 -->
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative">
<div class="absolute right-0 top-0 bottom-0 w-[1px] bg-inverse-surface/25"></div>
</div>
<div class="relative"></div>
</div>
<!-- Active Crop Region Frame & Handles -->
<div class="absolute inset-3 pointer-events-none z-20">
<!-- Subtle Perimeter Guide -->
<div class="w-full h-full relative">
<!-- Top-Left Grab Handle -->
<div class="absolute -top-1 -left-1 w-5 h-5 flex flex-col justify-start items-start">
<div class="w-4 h-[3px] bg-primary rounded-full shadow-sm"></div>
<div class="w-[3px] h-4 bg-primary rounded-full -mt-[3px] shadow-sm"></div>
</div>
<!-- Top-Right Grab Handle -->
<div class="absolute -top-1 -right-1 w-5 h-5 flex flex-col justify-start items-end">
<div class="w-4 h-[3px] bg-primary rounded-full shadow-sm"></div>
<div class="w-[3px] h-4 bg-primary rounded-full -mt-[3px] shadow-sm"></div>
</div>
<!-- Bottom-Left Grab Handle -->
<div class="absolute -bottom-1 -left-1 w-5 h-5 flex flex-col justify-end items-start">
<div class="w-[3px] h-4 bg-primary rounded-full -mb-[3px] shadow-sm"></div>
<div class="w-4 h-[3px] bg-primary rounded-full shadow-sm"></div>
</div>
<!-- Bottom-Right Grab Handle -->
<div class="absolute -bottom-1 -right-1 w-5 h-5 flex flex-col justify-end items-end">
<div class="w-[3px] h-4 bg-primary rounded-full -mb-[3px] shadow-sm"></div>
<div class="w-4 h-[3px] bg-primary rounded-full shadow-sm"></div>
</div>
</div>
</div>
<!-- Interactive Pan / Zoom Hint Badge -->
<div class="absolute bottom-3 right-3 z-30 bg-surface-container-lowest/80 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-md">
<span class="material-symbols-outlined text-primary text-[14px]">pinch</span>
<span class="font-caption-sm text-caption-sm text-on-surface-variant tracking-wider uppercase font-medium">1:1 Square</span>
</div>
</div>
<!-- Technical Utility Details Strip -->
<div class="mt-4 flex items-center justify-between px-1">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-success"></div>
<span class="font-caption-sm text-caption-sm text-on-surface-variant">PBR Source Buffer: 2048 × 2048</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant">
<button class="h-8 px-2.5 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors flex items-center gap-1.5 text-on-surface active:scale-95" id="btn-reset">
<span class="material-symbols-outlined text-[15px]">refresh</span>
<span class="font-caption-sm text-caption-sm">Reset</span>
</button>
<button class="h-8 w-8 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors flex items-center justify-center text-on-surface active:scale-95" id="btn-rotate">
<span class="material-symbols-outlined text-[16px]">rotate_90_degrees_cw</span>
</button>
</div>
</div>
<!-- Mode Selector: Segmented Control -->
<div class="mt-6 flex justify-center w-full">
<div class="bg-surface-container-low p-1 rounded-full flex items-center gap-1 w-full max-w-[280px]">
<button class="flex-1 py-2 px-4 rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm" id="mode-crop-btn">
<span class="material-symbols-outlined text-[16px]">crop</span>
<span>Crop</span>
</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5" id="mode-mask-btn">
<span class="material-symbols-outlined text-[16px]">filter_vintage</span>
<span>Mask</span>
</button>
</div>
</div>
<!-- Secondary Parameter Micro-Sheet (Ergonomic Lower Half) -->
<div class="mt-6 p-4 rounded-xl bg-surface-container-low shadow-sm flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">straighten</span>
<span class="font-label-md text-label-md text-on-surface">Seamless Tiling Edge Bias</span>
</div>
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono" id="bias-val">0.00°</span>
</div>
<div class="relative w-full flex items-center">
<input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary-container" id="bias-slider" max="45" min="-45" type="range" value="0"/>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-caption-sm text-caption-sm">-45°</span>
<span class="font-caption-sm text-caption-sm text-primary font-medium">Auto-Aligned</span>
<span class="font-caption-sm text-caption-sm">+45°</span>
</div>
</div>
<!-- Primary Pinned Action Button -->
<div class="mt-8 w-full">
<button class="w-full h-[52px] bg-primary-container text-on-primary font-label-md text-label-md rounded-xl flex items-center justify-center gap-2 active:scale-[0.99] transition-all duration-150 shadow-md hover:bg-primary" id="btn-next">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    let rotation = 0;
    let scale = 1;
    const img = document.getElementById('crop-target-image');
    const biasSlider = document.getElementById('bias-slider');
    const biasVal = document.getElementById('bias-val');
    const btnRotate = document.getElementById('btn-rotate');
    const btnReset = document.getElementById('btn-reset');
    const btnCrop = document.getElementById('mode-crop-btn');
    const btnMask = document.getElementById('mode-mask-btn');
    const btnNext = document.getElementById('btn-next');

    function updateTransform() {
      const bias = biasSlider ? parseFloat(biasSlider.value) : 0;
      if (img) {
        img.style.transform = `rotate(${rotation + bias}deg) scale(${scale})`;
      }
    }

    if (btnRotate) {
      btnRotate.addEventListener('click', () => {
        rotation = (rotation + 90) % 360;
        updateTransform();
      });
    }

    if (biasSlider && biasVal) {
      biasSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        biasVal.textContent = (val > 0 ? '+' : '') + val.toFixed(1) + '°';
        updateTransform();
      });
    }

    if (btnReset) {
      btnReset.addEventListener('click', () => {
        rotation = 0;
        scale = 1;
        if (biasSlider) biasSlider.value = "0";
        if (biasVal) biasVal.textContent = "0.00°";
        updateTransform();
      });
    }

    // Segmented Control toggling
    if (btnCrop && btnMask) {
      btnCrop.addEventListener('click', () => {
        btnCrop.className = "flex-1 py-2 px-4 rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm";
        btnMask.className = "flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5";
      });

      btnMask.addEventListener('click', () => {
        btnMask.className = "flex-1 py-2 px-4 rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5 shadow-sm";
        btnCrop.className = "flex-1 py-2 px-4 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all duration-200 flex items-center justify-center gap-1.5";
      });
    }

    if (btnNext) {
      btnNext.addEventListener('click', () => {
        const prevText = btnNext.innerHTML;
        btnNext.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Processing Source...</span>`;
        btnNext.disabled = true;
        setTimeout(() => {
          btnNext.innerHTML = prevText;
          btnNext.disabled = false;
        }, 1200);
      });
    }
  })();
</script></main></body></html>
