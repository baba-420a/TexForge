<script>
  function setMode(mode) {
    const aiBtn = document.getElementById('seg-ai');
    const fastBtn = document.getElementById('seg-fast');

    if (mode === 'ai') {
      aiBtn.className = "flex-1 py-2 px-3 rounded-lg bg-surface-variant text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all shadow-sm";
      fastBtn.className = "flex-1 py-2 px-3 rounded-lg text-on-surface-variant font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all";
    } else {
      fastBtn.className = "flex-1 py-2 px-3 rounded-lg bg-surface-variant text-on-surface font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all shadow-sm";
      aiBtn.className = "flex-1 py-2 px-3 rounded-lg text-on-surface-variant font-label-md text-label-md flex items-center justify-center gap-1.5 transition-all";
    }
  }

  function selectChannel(target, channelName, badgeText) {
    const chips = document.querySelectorAll('.channel-chip');
    chips.forEach(chip => {
      chip.className = "channel-chip h-9 px-4 rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md transition-colors flex items-center gap-1.5";
      const icon = chip.querySelector('.material-symbols-outlined');
      if (icon) icon.remove();
    });

    target.className = "channel-chip active h-9 px-4 rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-colors flex items-center gap-1.5";
    const checkIcon = document.createElement('span');
    checkIcon.className = "material-symbols-outlined text-[16px]";
    checkIcon.innerText = "check";
    target.insertBefore(checkIcon, target.firstChild);

    document.getElementById('badge-label').innerText = badgeText;
  }

  function toggleInspectorMode() {
    const badge = document.getElementById('badge-label');
    if (badge) {
      badge.style.transform = "scale(1.05)";
      setTimeout(() => badge.style.transform = "scale(1)", 180);
    }
  }
