mary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe px-margin bg-surface"><div class="flex flex-col w-full pb-6">

<div class="flex items-center justify-center pt-2 pb-4">
<div class="flex p-1 bg-surface-container-low rounded-full w-full max-w-xs shadow-sm">
<button class="flex-1 py-1.5 px-4 text-center font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors rounded-full" onclick="location.hash='#crop'">
        Crop

<button aria-current="page" class="flex-1 py-1.5 px-4 text-center font-label-md text-label-md bg-primary-container text-on-primary font-medium rounded-full shadow-sm transition-all">
        Mask
      </button>
</div>
</div>
<!-- Interactive Visual Viewport Area (Stone Texture Canvas with Painted Mask Overlay) -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden bg-surface-container-lowest shadow-md flex items-center justify-center">
<!-- Base Texture Image -->
<img alt="Granite stone surface preview" class="absolute inset-0 w-full h-full object-cover select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7TNFbO2E1OGpeeLD2G_gylqxsURD-9UxtWgrZyA_BTCvMu2FTcYfUAel-cH8A8vgpLM_uPcLCnIZmuVBhJ1iBYcMfCT0zUAGu1BJXoIU7mLDGiJK9abyq-CK3j4CAaHmv_nsAnxE55XLHxNWf5Z0oAr1tCdNfE_lAqgFKhix0eQsSf6rU8ioIBSiFjiMhKUcDWC3y-c5J1PQO4gJu69_YOOMzVqyC-FJKGMhBosU"/>
<!-- Semi-transparent Red Painted Mask Overlay highlighting deep occluded fissures -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<!-- Mask Path 1: Central Cavity -->
<path d="M120 180 C 130 160, 160 150, 185 165 C 200 175, 210 210, 195 235 C 180 250, 140 260, 125 240 C 115 220, 110 195, 120 180 Z" fill="#FF6B6B" fill-opacity="0.45"></path>
<!-- Mask Path 2: Lower Right Depressions -->
<path d="M240 240 C 265 230, 295 245, 305 270 C 315 295, 290 320, 260 315 C 235 310, 220 280, 230 255 C 235 245, 238 242, 240 240 Z" fill="#FF6B6B" fill-opacity="0.45"></path>
<!-- Mask Path 3: Subtle Crevice Scatter -->
<path d="M140 300 C 155 290, 175 295, 180 315 C 185 330, 165 345, 145 340 C 130 335, 130 310, 140 300 Z" fill="#FF6B6B" fill-opacity="0.45"></path>
<path d="M260 120 C 275 110, 300 115, 305 130 C 310 145, 290 160, 275 155 C 255 150, 250 130, 260 120 Z" fill="#FF6B6B" fill-opacity="0.45"></path>
</svg>
<!-- Interactive Mask Cursor Indicator -->
<div class="absolute w-6 h-6 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-75 shadow-sm" id="brush-cursor" style="top: 48%; left: 45%; background-color: rgba(255, 107, 107, 0.45);">
<div class="w-full h-full rounded-full ring-2 ring-primary/60 animate-ping opacity-30"></div>
</div>
<!-- Viewport HUD Overlay Chips -->
<div class="absolute top-3 left-3 px-2.5 py-1 bg-surface-container-low/80 backdrop-blur-md rounded-full shadow-sm flex items-center gap-1.5 pointer-events-none">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-caption-sm text-caption-sm text-on-surface font-medium">Blemish Exclusion</span>
</div>
<div class="absolute top-3 right-3 px-2 py-1 bg-surface-container-low/80 backdrop-blur-md rounded-lg shadow-sm flex items-center pointer-events-none">
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono">1:1 PBR</span>
</div>
</div>
<!-- Primary Editing Controls & Palette -->
<div class="flex flex-col gap-5 mt-5">
<!-- Tool Mode Selection Chips -->
<div class="flex items-center gap-2.5 justify-start w-full overflow-x-auto no-scrollbar py-0.5">
<!-- Brush Tool (Active) -->
<button class="tool-btn h-9 px-4 rounded-full flex items-center gap-1.5 bg-primary-container text-on-primary font-label-md text-label-md font-medium shadow-sm transition-all" id="tool-brush">
<span class="material-symbols-outlined text-[18px]">brush</span>
<span>Brush</span>
</button>
<!-- Erase Tool -->
<button class="tool-btn h-9 px-4 rounded-full flex items-center gap-1.5 bg-surface text-on-surface-variant hover:text-on-surface font-label-md text-label-md font-medium transition-all" id="tool-erase">
<span class="material-symbols-outlined text-[18px]">auto_fix_normal</span>
<span>Erase</span>
</button>
<!-- Undo Tool -->
<button class="tool-btn h-9 px-4 rounded-full flex items-center gap-1.5 bg-surface text-on-surface-variant hover:text-on-surface active:scale-95 font-label-md text-label-md font-medium transition-all" id="tool-undo">
<span class="material-symbols-outlined text-[18px]">undo</span>
<span>Undo</span>
</button>
<!-- Clear All Text Button -->
<button class="h-9 px-3 rounded-full flex items-center text-on-surface-variant hover:text-error font-label-md text-label-md ml-auto transition-colors">
<span class="material-symbols-outlined text-[18px] mr-1">delete_sweep</span>
<span>Clear</span>
</button>
</div>
<!-- Parameter Sliders Section -->
<div class="bg-surface-container-low p-4 rounded-xl flex flex-col gap-3 shadow-sm">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">line_weight</span>
<span class="font-label-md text-label-md text-on-surface font-medium">Brush size</span>
</div>
<span class="font-caption-sm text-caption-sm text-on-surface-variant font-mono" id="brush-size-val">24 px</span>
</div>
<!-- Custom Minimal Range Slider Control -->
<div class="relative flex items-center w-full h-5">
<input aria-label="Brush size" class="w-full h-1.5 bg-surface-container-highest rounded-full appearance-none cursor-pointer accent-primary-container focus:outline-none" id="brush-slider" max="64" min="8" type="range" value="24"/>
</div>
<!-- Subtle Quick Presets -->
<div class="flex justify-between items-center px-1 font-caption-sm text-caption-sm text-on-surface-variant opacity-70">
<button class="hover:text-primary transition-colors" onclick="setBrushSize(12)">Fine (12px)</button>
<button class="hover:text-primary transition-colors" onclick="setBrushSize(24)">Medium (24px)</button>
<button class="hover:text-primary transition-colors" onclick="setBrushSize(48)">Coarse (48px)</button>
</div>
</div>
<!-- Quick Tip & Contextual Insight -->
<div class="flex items-center gap-2.5 px-3 py-2 bg-surface-container-lowest rounded-lg">
<span class="material-symbols-outlined text-tertiary text-[18px] flex-shrink-0">lightbulb</span>
<p class="font-caption-sm text-caption-sm text-on-surface-variant leading-tight">
        Mask deep shadows or unnatural voids to prevent depth warping during height map synthesis.
      </p>
</div>
</div>
<!-- Primary Pinned Action Button -->
<div class="mt-6 w-full">
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-xl font-label-md text-label-md font-medium shadow-md hover:brightness-105 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function initMaskControls() {
    const slider = document.getElementById('brush-slider');
    const valueDisplay = document.getElementById('brush-size-val');
    const cursor = document.getElementById('brush-cursor');
    const toolButtons = document.querySelectorAll('.tool-btn');

    function updateSize(val) {
      if (!slider || !valueDisplay || !cursor) return;
      slider.value = val;
      valueDisplay.textContent = val + ' px';
      cursor.style.width = val + 'px';
      cursor.style.height = val + 'px';
    }

    window.setBrushSize = updateSize;

    if (slider) {
      slider.addEventListener('input', function(e) {
        updateSize(e.target.value);
      });
    }

    toolButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.id === 'tool-undo') return;
        toolButtons.forEach(b => {
          if (b.id !== 'tool-undo') {
            b.className = 'tool-btn h-9 px-4 rounded-full flex items-center gap-1.5 bg-surface text-on-surface-variant hover:text-on-surface font-label-md text-label-md font-medium transition-all';
          }
        });
        this.className = 'tool-btn h-9 px-4 rounded-full flex items-center gap-1.5 bg-primary-container text-on-primary font-label-md text-label-md font-medium shadow-sm transition-all';
      });
    });
  })();
</script></main></body></html>
